<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hellow world</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }

    #fireworks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      max-width: 90vw;
    }

    h1 {
      font-size: 2.5rem;
      color: #2d3748;
      margin-bottom: 28px;
      word-break: break-word;
    }

    button {
      font-size: 1.125rem;
      padding: 12px 48px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #5a6fd8;
    }

    button:active {
      transform: scale(0.96);
    }

    .cheer {
      margin-top: 24px;
      font-size: 2rem;
      font-weight: 700;
      color: #48bb78;
      animation: pop 0.4s ease;
    }

    .cheer[hidden] {
      display: none;
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      70% {
        transform: scale(1.15);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>
  <main class="card">
    <h1>Hellow world</h1>
    <button id="ok-btn" type="button">ОК</button>
    <p id="cheer" class="cheer" hidden>Ура!</p>
  </main>

  <script>
    (function () {
      var cheer = document.getElementById('cheer');
      var canvas = document.getElementById('fireworks');
      var ctx = canvas.getContext('2d');
      var rockets = [];
      var particles = [];
      var running = false;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function launch() {
        rockets.push({
          x: canvas.width * (0.15 + Math.random() * 0.7),
          y: canvas.height + 10,
          targetY: canvas.height * (0.1 + Math.random() * 0.3),
          vx: (Math.random() - 0.5) * 2.5,
          vy: -(10 + Math.random() * 4),
          hue: Math.random() * 360
        });
      }

      function explode(rocket) {
        var count = 60 + Math.floor(Math.random() * 40);
        var secondHue = (rocket.hue + 140) % 360;
        for (var i = 0; i < count; i++) {
          var angle = Math.random() * Math.PI * 2;
          var speed = 1 + Math.random() * 4.5;
          particles.push({
            x: rocket.x,
            y: rocket.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.008 + Math.random() * 0.012,
            hue: Math.random() < 0.3 ? secondHue : rocket.hue + Math.random() * 24 - 12,
            size: 1.5 + Math.random() * 1.5
          });
        }
      }

      function frame() {
        if (!rockets.length && !particles.length) {
          running = false;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (var i = rockets.length - 1; i >= 0; i--) {
          var r = rockets[i];
          r.x += r.vx;
          r.y += r.vy;
          r.vy += 0.06;

          ctx.globalAlpha = 1;
          ctx.strokeStyle = 'hsl(' + r.hue + ', 100%, 70%)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(r.x - r.vx * 2, r.y - r.vy * 2);
          ctx.lineTo(r.x, r.y);
          ctx.stroke();

          if (r.y <= r.targetY || r.vy > -2) {
            explode(r);
            rockets.splice(i, 1);
          }
        }

        for (var j = particles.length - 1; j >= 0; j--) {
          var p = particles[j];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.985;
          p.vy = p.vy * 0.985 + 0.04;
          p.life -= p.decay;

          if (p.life <= 0) {
            particles.splice(j, 1);
            continue;
          }

          var twinkle = p.life < 0.4 ? 0.4 + Math.random() * 0.6 : 1;
          ctx.globalAlpha = p.life * twinkle;
          ctx.strokeStyle = 'hsl(' + p.hue + ', 100%, 60%)';
          ctx.lineWidth = p.size;
          ctx.beginPath();
          ctx.moveTo(p.x - p.vx * 2, p.y - p.vy * 2);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }

      document.getElementById('ok-btn').addEventListener('click', function () {
        cheer.hidden = false;
        launch();
        setTimeout(launch, 250 + Math.random() * 250);
        if (!running) {
          running = true;
          requestAnimationFrame(frame);
        }
      });
    })();
  </script>
</body>
</html>
